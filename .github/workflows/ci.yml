name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
      - run: python3 tool/currencies.py --check
      - run: golangci-lint config verify
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
      - run: go test -race -count=1 ./...
      - run: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 --config openapi-codegen.yaml -o internal/apiv1/api.gen.go internal/apicontract/v1/openapi.json
      - run: git diff --exit-code -- internal/apiv1/api.gen.go
      - run: go vet ./...
      - run: go build ./...
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 vet
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - run: git diff --exit-code -- internal/database/sqlgen
      - run: go test ./internal/config -run='^$' -fuzz='^FuzzGinMode$' -fuzztime=10s
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -tags=integration -count=1 -timeout=5m ./tests/integration/...
