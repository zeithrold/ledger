version: "2"
run:
  timeout: 5m
  tests: true
  build-tags: [integration]
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - noctx
    - errorlint
    - durationcheck
    - nilerr
    - unconvert
    - unparam
    - misspell
    - gocritic
    - revive
    - gosec
    - nolintlint
    - sloglint
    - forbidigo
    - depguard
  settings:
    depguard:
      rules:
        pure-kernel:
          list-mode: strict
          files:
            - '**/internal/money/*.go'
            - '**/internal/problem/*.go'
          allow:
            - '$gostd'
          deny:
            - pkg: net
              desc: Pure monetary and error types cannot perform network I/O.
            - pkg: os
              desc: Pure monetary and error types cannot access process or filesystem state.
            - pkg: database/sql
              desc: Persistence belongs outside the pure kernel.
            - pkg: syscall
              desc: Pure code cannot call operating system APIs.
            - pkg: unsafe
              desc: Pure code must retain memory safety.
        business-transport:
          list-mode: lax
          files:
            - '**/internal/accounting/*.go'
            - '**/internal/identity/*.go'
            - '**/internal/auth/*.go'
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: HTTP belongs in httpserver or problemhttp.
            - pkg: github.com/zeithrold/ledger/internal/httpserver
              desc: Services must not depend on transport adapters.
            - pkg: github.com/zeithrold/ledger/internal/problemhttp
              desc: Services use pure problem types, never HTTP responders.
            - pkg: github.com/zeithrold/ledger/internal/apiv1
              desc: Map generated DTOs at the HTTP boundary.
    sloglint:
      context: scope
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print.*|log\.(Print.*|Fatal.*|Panic.*)|gin\.(Default|Logger|Recovery))$'
          msg: Use context-aware slog and the shared observability/recovery pipeline.
    errcheck:
      check-type-assertions: true
      check-blank: true
    nolintlint:
      require-explanation: true
      require-specific: true
    govet:
      enable-all: true
      disable: [fieldalignment]
  exclusions:
    generated: strict
    presets: []
formatters:
  enable: [gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/zeithrold/ledger]
  exclusions:
    generated: strict
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
