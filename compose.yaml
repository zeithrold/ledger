name: ledger
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_local_only
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
