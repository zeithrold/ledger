version: "2"
sql:
  - engine: "postgresql"
    # Ledger-owned migrations are listed explicitly so sqlc never models the
    # River queue tables in 00005_river.sql, which Ledger does not query. Add
    # every new Ledger migration here; a query against an unlisted table fails
    # generation immediately.
    schema:
      - "migrations/00001_scaffold.sql"
      - "migrations/00002_identity.sql"
      - "migrations/00003_accounting.sql"
      - "migrations/00004_currency_metadata.sql"
      - "migrations/00006_market_rates.sql"
    queries: "internal/database/queries"
    gen:
      go:
        package: "sqlgen"
        out: "internal/database/sqlgen"
        sql_package: "pgx/v5"
        emit_empty_slices: true
